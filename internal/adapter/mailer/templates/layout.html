<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Callit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--[if mso]>
<noscript>
<xml>
<o:OfficeDocumentSettings>
<o:PixelsPerInch>96</o:PixelsPerInch>
</o:OfficeDocumentSettings>
</xml>
</noscript>
<style>
  table, td { border-collapse: collapse; }
  .cl-heading { font-family: Arial, Helvetica, sans-serif !important; }
</style>
<![endif]-->
<style>
  body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
  body { margin: 0; padding: 0; width: 100% !important; background-color: #E7E4DA; }

  .cl-wordmark { font-family: 'Space Grotesk', Arial, Helvetica, sans-serif; }
  .cl-body-font { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

  @media screen and (max-width: 600px) {
    .cl-container { width: 100% !important; }
    .cl-px { padding-left: 24px !important; padding-right: 24px !important; }
    .cl-stack { display: block !important; width: 100% !important; text-align: center !important; }
  }
</style>
</head>
<body class="cl-body-font" style="margin:0; padding:0; background-color:#E7E4DA;">
  <!-- Preheader: shows in the inbox list, hidden in the body. Set per email. -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#FBF8F1;">
    {{preheader}}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#E7E4DA;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <!--[if mso]>
        <table role="presentation" align="center" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td>
        <![endif]-->
        <table role="presentation" class="cl-container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#FBF8F1; border-radius:20px; overflow:hidden;">

          <!-- Header -->
          <tr>
            <td align="center" style="padding:32px 24px 24px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <!-- Swap for a hosted <img src="https://.../logo.png" width="28" height="28" alt="Callit"> if you want
                       the full ring-and-check mark — inline SVG like this won't render in Outlook desktop. -->
                  <td style="padding-right:8px; vertical-align:middle;">
                    <div style="width:22px; height:22px; border:2px solid #111426; border-radius:50%;"></div>
                  </td>
                  <td class="cl-wordmark" style="vertical-align:middle; font-size:20px; font-weight:700; color:#111426; letter-spacing:-0.02em;">Callit</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ============ CONTENT START — replace this row's contents for a new email ============ -->
          <tr>
            <td class="cl-px" style="padding:8px 40px 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td class="cl-wordmark" style="font-size:24px; font-weight:700; color:#111426; padding-bottom:12px;">{{heading}}</td>
                </tr>
                <tr>
                  <td class="cl-body-font" style="font-size:15px; line-height:1.6; color:#5B6478; padding-bottom:28px;">
                    {{body}}
                  </td>
                </tr>
                <tr>
                  <td align="center">
                    <!-- Primary button pattern — copy this table for any CTA -->
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" style="border-radius:999px; background-color:#FFD23F;">
                          <a href="{{button_url}}" target="_blank" class="cl-body-font" style="display:inline-block; padding:14px 32px; font-size:14.5px; font-weight:700; color:#111426; text-decoration:none; border-radius:999px;">{{button_label}}</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- ============ CONTENT END ============ -->

          <!-- Divider -->
          <tr>
            <td style="padding:0 40px;">
              <div style="height:1px; background-color:#E7E4DA; line-height:1px; font-size:1px;">&nbsp;</div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" class="cl-px" style="padding:28px 40px 36px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" class="cl-body-font" style="font-size:12.5px; line-height:1.6; color:#9B9F8E; padding-bottom:10px;">
                    <a href="https://panta.market" target="_blank" style="color:#5B6478; font-weight:600; text-decoration:none;">Powered by Panta</a>
                    &nbsp;·&nbsp; Non-custodial &nbsp;·&nbsp; Built on Solana
                  </td>
                </tr>
                <tr>
                  <td align="center" class="cl-body-font" style="font-size:12px; line-height:1.6; color:#9B9F8E;">
                    Questions? Write to <a href="mailto:{{support_email}}" style="color:#5B6478; text-decoration:underline;">{{support_email}}</a>
                    <br>
                    © 2026 Callit. Built for the Panta API Side Track, Colosseum Crypto World's Fair.
                    <br>
                    <a href="{{unsubscribe_link}}" style="color:#9B9F8E; text-decoration:underline;">Unsubscribe</a> from product emails
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
        <!--[if mso]>
        </td></tr></table>
        <![endif]-->

      </td>
    </tr>
  </table>
</body>
</html>
